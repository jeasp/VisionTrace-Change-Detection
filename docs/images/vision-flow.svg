<svg xmlns="http://www.w3.org/2000/svg" width="795" height="213" viewBox="0 0 795 213" role="img" aria-labelledby="title desc" lang="ko">
  <title id="title">VisionTrace 시스템 구조</title>
  <desc id="desc">USB 카메라에서 영상을 수집한 camera.py는 최신 JPEG를 Flask API에 제공하고 약 0.1초마다 detector.py를 호출합니다. 변화가 감지되면 사진을 파일로, 이력을 MySQL에 기록합니다. Flask API를 통해 MFC 관리자에서 실시간 영상과 이력을 확인합니다.</desc>
  <style>
    text { font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans CJK KR", sans-serif; }
    .box { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1.2; }
    .name { fill: #1e293b; font-weight: 700; }
    .name { font-size: 18px; text-anchor: middle; }
    .detail, .label { fill: #475569; font-size: 14px; text-anchor: middle; }
    .arrow { fill: none; stroke: #64748b; stroke-width: 1.7; stroke-linejoin: round; }
    .tip { fill: #64748b; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #202d3b; stroke: #718396; }
      .name { fill: #f2f6fb; }
      .detail, .label { fill: #c6d3e1; }
      .arrow { stroke: #a4b5c8; }
      .tip { fill: #a4b5c8; }
    }
  </style>
  <defs>
    <marker id="tip" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path class="tip" d="M0 0 L8 4 L0 8 Z"/>
    </marker>
  </defs>
  <g id="usb" transform="translate(12 12)">
    <rect class="box" width="139" height="62" rx="10"/>
    <text class="name" x="69.5" y="27">USB 카메라</text>
    <text class="detail" x="69.5" y="48">작업대 영상</text>
  </g>
  <g id="camera" transform="translate(199 12)">
    <rect class="box" width="151" height="62" rx="10"/>
    <text class="name" x="75.5" y="27">camera.py</text>
    <text class="detail" x="75.5" y="48">영상 수집</text>
  </g>
  <g id="api" transform="translate(450 12)">
    <rect class="box" width="158" height="62" rx="10"/>
    <text class="name" x="79" y="27">Flask API</text>
    <text class="detail" x="79" y="48">영상 · 이력 제공</text>
  </g>
  <g id="mfc" transform="translate(642 12)">
    <rect class="box" width="141" height="62" rx="10"/>
    <text class="name" x="70.5" y="27">MFC 관리자</text>
    <text class="detail" x="70.5" y="48">실시간 화면 · 이력</text>
  </g>
  <g id="detector" transform="translate(199 139)">
    <rect class="box" width="151" height="62" rx="10"/>
    <text class="name" x="75.5" y="27">detector.py</text>
    <text class="detail" x="75.5" y="48">변화 이벤트 생성</text>
  </g>
  <g id="storage" transform="translate(434 139)">
    <rect class="box" width="190" height="62" rx="10"/>
    <text class="name" x="95" y="27">이력 저장</text>
    <text class="detail" x="95" y="48">사진 파일 · MySQL 기록</text>
  </g>
  <path id="usb-to-camera" class="arrow" d="M151 43 H194" marker-end="url(#tip)"/>
  <path id="camera-to-api" class="arrow" d="M350 43 H445" marker-end="url(#tip)"/>
  <path id="api-to-mfc" class="arrow" d="M608 43 H637" marker-end="url(#tip)"/>
  <path id="camera-to-detector" class="arrow" d="M274.5 74 V134" marker-end="url(#tip)"/>
  <path id="detector-to-storage" class="arrow" d="M350 170 H429" marker-end="url(#tip)"/>
  <path id="storage-to-api" class="arrow" d="M529 139 V79" marker-end="url(#tip)"/>
  <text class="label" x="399" y="32">최신 JPEG</text>
  <text class="label" x="326" y="110">약 0.1초마다</text>
  <text class="label" x="572" y="110">저장된 이력</text>
</svg>
